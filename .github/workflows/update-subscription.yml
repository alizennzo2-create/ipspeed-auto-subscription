
name: Update IPSpeed VLESS Subscription

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and build subscription
        run: |
          python - <<'PY'
          import re, html, base64, urllib.request
          from pathlib import Path

          urls = [
              "https://r.jina.ai/https://ipspeed.info/free-vless-reality.php",
              "https://ipspeed.info/free-vless-reality.php"
          ]

          page = ""
          errors = []

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "text/plain,text/html,*/*"
                  })
                  with urllib.request.urlopen(req, timeout=60) as r:
                      page = r.read().decode("utf-8", errors="replace")
                  if page:
                      break
              except Exception as e:
                  errors.append(str(e))

          if not page:
              raise SystemExit("All sources failed: " + " | ".join(errors))

          page = html.unescape(page)
          links = re.findall(r'vless://[^\s"\'<>`]+', page)

          cleaned = []
          for link in links:
              link = link.rstrip(");,]")
              if "@" in link and link not in cleaned:
                  cleaned.append(link)

          if not cleaned:
              raise SystemExit("No VLESS links found.")

          Path("public").mkdir(exist_ok=True)
          raw = "\n".join(cleaned) + "\n"
          Path("public/configs.txt").write_text(raw, encoding="utf-8")
          encoded = base64.b64encode(raw.encode()).decode()
          Path("public/subscription.txt").write_text(encoded, encoding="utf-8")
          print(f"SUCCESS: {len(cleaned)} unique VLESS links.")

          PY

      - name: Commit updated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/configs.txt public/subscription.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update VLESS subscription"
            git push
          else
            echo "No changes."
          fi
